name: vidhub
description: Routine launcher for Windows. At the right time it opens the right apps, sites and files, and keeps nagging until you act.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  # Windows desktop integration
  window_manager: ^0.5.0
  hotkey_manager: ^0.2.3
  system_tray: ^2.0.3

  # Launching URLs / deep links
  url_launcher: ^6.3.1

  # Local storage location
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
